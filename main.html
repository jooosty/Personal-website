<!-- main.html -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>My Base Website - Play to Unlock!</title>
</head>
<body>

    <header>
        <h1>Play Tetris to Unlock My Info!</h1>
    </header>
    
    <main>
        <!-- Tetris Game Section -->
        <div class="game-section">
            <h1>Tetris Challenge</h1>
            <canvas id="tetris"></canvas>
            <div class="score-display">
                <p>Score: <span id="score">0</span></p>
            </div>
        </div>
        
        <!-- About Me Section -->
        <div class="about-me">
            <h1>About Me</h1>
            <div id="section-name">
                <h2>Name <span class="unlock-badge" data-section="name">Unlock at -- pts</span></h2>
                <p id="name" class="locked"></p>
            </div>

            <div id="section-age">
                <h2>Age <span class="unlock-badge" data-section="age">Unlock at -- pts</span></h2>
                <p id="age" class="locked"></p>
            </div>

            <div id="section-location">
                <h2>Location <span class="unlock-badge" data-section="location">Unlock at -- pts</span></h2>
                <p id="location" class="locked"></p>
            </div>

            <div id="section-hobbies">
                <h2>My Hobbies <span class="unlock-badge" data-section="hobbies-list">Unlock at -- pts</span></h2>
                <ul id="hobbies-list" class="locked"></ul>
            </div>

            <div id="section-course">
                <h2>My Courses <span class="unlock-badge" data-section="course-list">Unlock at -- pts</span></h2>
                <ul id="course-list" class="locked"></ul>
            </div>

            <div id="section-occupation">
                <h2>My Occupation <span class="unlock-badge" data-section="occupation-list">Unlock at -- pts</span></h2>
                <ul id="occupation-list" class="locked"></ul>
            </div>

            <div id="section-goals">
                <h2>My Learning Goals <span class="unlock-badge" data-section="learning-goals">Unlock at -- pts</span></h2>
                <ul id="learning-goals" class="locked"></ul>
            </div>
            </div>
            </main>

    <script src="js/main.js"></script>
    <script src="js/tetris.js"></script>

</body>
</html>
